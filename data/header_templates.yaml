# Blog header image templates.
#
# A blog post can set `header:` in its front matter instead of `images:` and
# `post.image:`, and Hugo draws the title and subtitle onto the template's
# background at build time. See contributing-blog-posts.md.
#
# Each template has:
#   background:    image file in assets/header-templates/
#   format:        optional; on-page image (Hugo image processing spec).
#                  Default: "resize 1700x webp q85 Lanczos text". The page
#                  shows it at most 850px wide, so 1700px keeps it sharp on
#                  high-DPI screens. Lanczos resampling and the "text" hint
#                  keep the lettering crisp.
#   social_format: optional; og:image for link previews.
#                  Default: "resize 1200x jpg q85 Lanczos". JPEG, because not
#                  every preview crawler reads WebP.
#   title / subtitle: options for Hugo's images.Text filter
#     font:   TTF file in assets/
#     size:   font size in pixels
#     x, y:   position in pixels from the top-left corner
#     alignx: left, center or right (x is the anchor point)
#     aligny: top, center or bottom (y is the anchor point; with "bottom",
#             y is the baseline of the last line, so a title that wraps
#             grows upward instead of running into the subtitle)
#     linespacing: extra pixels between wrapped lines
#     color:  hex color
#   caption: optional; text options for picture captions (font, size,
#     linespacing, color), plus margin: pixels between picture and caption.
#     Captions are centered below their picture.
#
# A post can also place pictures from static/ on its header with
# header.images, a list of {src, x, y, width, height, caption}: x and y are
# the picture's top-left corner, and it is cropped to width x height.
#
# A post can override any title / subtitle / caption option for itself under
# header.style.title, header.style.subtitle or header.style.caption in its
# front matter.

vulnerability:
  background: vulnerability.png
  title:
    font: fonts/Montserrat-SemiBold.ttf
    size: 140
    x: 110
    y: 560
    alignx: left
    aligny: bottom
    linespacing: 10
    color: "#ffffff"
  subtitle:
    font: fonts/Montserrat-Regular.ttf
    size: 64
    x: 110
    y: 593
    alignx: left
    aligny: top
    linespacing: 8
    color: "#ffffff"

election:
  background: election.png
  title:
    font: fonts/Montserrat-SemiBold.ttf
    size: 160
    x: 960
    y: 660
    alignx: center
    aligny: bottom
    linespacing: 24
    color: "#ffffff"
  subtitle:
    font: fonts/Montserrat-Regular.ttf
    size: 80
    x: 960
    y: 770
    alignx: center
    aligny: top
    linespacing: 8
    color: "#ffffff"
  caption:
    font: fonts/Montserrat-Regular.ttf
    size: 40
    linespacing: 6
    color: "#ffffff"
    margin: 30
