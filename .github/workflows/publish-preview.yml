name: Publish Preview Deployment
on:
  workflow_run:
    # Matches the `name:` field of build-preview.yml, NOT its filename.
    # A workflow_run trigger that matches nothing fails silently: no run is
    # created and no error is logged anywhere. Keep these two in step.
    workflows: ["Build Preview"]
    types: [completed]

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
      actions: read

    steps:
      - name: Download artifacts from triggering workflow
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = context.payload.workflow_run.id;
            const { owner, repo } = context.repo;
            const fs = require("fs");

            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id,
            });

            for (const name of ["preview-site", "pr-number"]) {
              const artifact = artifacts.data.artifacts.find(a => a.name === name);
              if (!artifact) {
                core.setFailed(`${name} artifact not found`);
                return;
              }

              const zip = await github.rest.actions.downloadArtifact({
                owner,
                repo,
                artifact_id: artifact.id,
                archive_format: "zip",
              });

              fs.writeFileSync(`${process.env.GITHUB_WORKSPACE}/${name}.zip`, Buffer.from(zip.data));
            }

      - name: Unzip artifacts
        run: |
          mkdir public
          unzip preview-site.zip -d public
          unzip pr-number.zip -d .

      - name: Resolve and verify PR number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const raw = fs.readFileSync("pr-number.txt", "utf8").trim();

            if (!/^[0-9]+$/.test(raw)) {
              core.setFailed(`pr-number.txt does not contain a PR number: ${JSON.stringify(raw)}`);
              return;
            }

            // build-preview.yml runs from the pull request head. On a fork PR that
            // is code we do not control, so the number above is untrusted input.
            // This job holds real secrets and pull-requests: write, so confirm the
            // PR it names is actually the one that was built before we deploy to a
            // branch alias or comment anywhere. Do not remove this check.
            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: Number(raw),
            });

            const built = context.payload.workflow_run.head_sha;
            if (pr.head.sha !== built) {
              core.setFailed(
                `PR #${raw} is at ${pr.head.sha} but this run built ${built}. Refusing to deploy.`
              );
              return;
            }

            core.setOutput("number", raw);

            // Deploy to the alias the build used for its baseURL. New builds use
            // a fresh alias per commit, because Cloudflare keeps serving files
            // from earlier deployments on a reused alias for up to a week, so
            // deleted files would still show up. The file is untrusted like the
            // number, so it must be exactly the alias for this PR and commit.
            //
            // Builds from a branch that predates preview-alias.txt still built
            // for pr-<number>, so keep deploying those there. This fallback can
            // go once no open PR is based on a master older than October 2026.
            let alias = `pr-${raw}`;
            if (fs.existsSync("preview-alias.txt")) {
              const recorded = fs.readFileSync("preview-alias.txt", "utf8").trim();
              const expected = `pr-${raw}-${built.slice(0, 7)}`;
              if (recorded !== expected) {
                core.setFailed(
                  `preview-alias.txt says ${JSON.stringify(recorded)}, expected ${expected}. Refusing to deploy.`
                );
                return;
              }
              alias = recorded;
            }
            core.setOutput("alias", alias);

      - name: Publish to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} --branch=${{ steps.pr.outputs.alias }}

      - name: Comment deployment URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const aliasUrl = `${{ steps.deploy.outputs.pages-deployment-alias-url }}`;
            const deploymentUrl = `${{ steps.deploy.outputs.deployment-url }}`;
            const url = aliasUrl || deploymentUrl;
            const status = `${{ steps.deploy.outcome }}`;

            const body = status === "success" && url
              ? `✅ Preview deployment is ready: ${url}`
              : `⚠️ Preview deployment step finished with status: ${status}.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number("${{ steps.pr.outputs.number }}"),
              body,
            });
