name: Build Preview
on: pull_request

jobs:
  build-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check for missing base language strings
        run: python3 find_missing_i18n_strings.py

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm

      # Installs Hugo and Dart Sass at the versions pinned in package.json
      - name: Install npm dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Generate language files
        run: python3 setup-pages-for-supported-languages.py

      - name: Generate get_almalinux data
        run: python3 tools/generate_get_almalinux_yaml.py

      # Cloudflare Pages serves this build at pr-<number>-<first 7 chars of head
      # SHA>. The alias is handed to publish-preview.yml in the pr-number
      # artifact, which deploys to it. Build with that URL so absolute links
      # (og:image, canonical, the RSS feed, the sitemap) point at the preview
      # instead of production. If any value is missing, fall back to the
      # baseURL in config.yaml rather than building a malformed host.
      - name: Work out the preview base URL
        id: baseurl
        env:
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          alias=""
          if [ -n "$PR" ] && [ -n "$SHA" ]; then
            alias="pr-$PR-${SHA:0:7}"
          fi
          echo "alias=$alias" >> "$GITHUB_OUTPUT"
          if [ -n "$PROJECT" ] && [ -n "$alias" ]; then
            echo "url=https://$alias.$PROJECT.pages.dev/" >> "$GITHUB_OUTPUT"
          else
            echo "url=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          PREVIEW_BASE_URL: ${{ steps.baseurl.outputs.url }}
        run: |
          if [ -n "$PREVIEW_BASE_URL" ]; then
            npx --no-install hugo --minify --buildFuture --baseURL "$PREVIEW_BASE_URL"
          else
            npx --no-install hugo --minify --buildFuture
          fi

      - name: Move redirects file into place
        run: cp _redirects public/

      - name: Move headers file into place
        run: cp _headers public/

      - name: Build search index
        run: npx --no-install pagefind --site "public"

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-site
          path: public
          retention-days: 3

      # The deploy workflow runs on workflow_run, where GitHub leaves
      # pull_requests[] empty for pull requests opened from a fork. Hand the
      # number across in the artifact instead, along with the alias this build
      # was made for. See .github/workflows/README.md.
      - name: Record PR number and preview alias
        env:
          ALIAS: ${{ steps.baseurl.outputs.alias }}
        run: |
          echo "${{ github.event.pull_request.number }}" > pr-number.txt
          echo "$ALIAS" > preview-alias.txt

      - name: Upload PR number and preview alias
        uses: actions/upload-artifact@v4
        with:
          name: pr-number
          path: |
            pr-number.txt
            preview-alias.txt
          retention-days: 3
